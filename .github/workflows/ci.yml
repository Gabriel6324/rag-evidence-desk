name: Verify
on: [push, pull_request, workflow_dispatch]
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q rag desktop.py desktop_settings.py desktop_help.py tests
      - run: node --check web/app.js
      - run: node --check web/guidance.js
      - if: runner.os == 'Linux'
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
          python tests/ui_smoke.py
          python tests/ui_history_paging.py
      - run: python scripts/package_release.py --out dist
